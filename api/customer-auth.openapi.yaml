openapi: 3.0.3
info:
  title: Wellness customer identity and onboarding status
  version: 0.2.0
  description: Session and record endpoints are documented in customer-onboarding.openapi.yaml and documentation/CLIENT_ONBOARDING.md.
paths:
  /api/v1/customer/auth/me:
    get:
      summary: Verify identity and return explicit onboarding status
      description: With onboarding disabled returns legacy not_linked proof without session. When enabled X-Customer-Session is mandatory and returns server deadlines, linked/pending status and pending review code. No email matching. Cache-Control no-store.
      parameters:
        - name: X-Customer-Session
          in: header
          description: Required when onboarding is enabled
          schema: {type: string}
      security:
        - customerBearer: []
      responses:
        '200':
          description: Valid identity and current onboarding status; no profile contents
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [authenticated, authentication_context, onboarding_status, capabilities]
                    properties:
                      authenticated: {type: boolean, enum: [true]}
                      authentication_context: {type: string, enum: [customer]}
                      onboarding_status: {type: string, enum: [not_linked, pending_review, linked]}
                      capabilities: {type: array, items: {type: string, enum: [own_profile, own_appointments]}}
                      review_code: {type: string, nullable: true}
                      session:
                        type: object
                        properties:
                          idle_expires_at: {type: integer, description: Unix seconds}
                          absolute_expires_at: {type: integer, description: Unix seconds}
        '401':
          description: Missing, expired, invalid or wrong-context bearer token
        '403':
          description: Missing access_as_client scope
        '503':
          description: Customer identity not configured or signing-key service unavailable
components:
  securitySchemes:
    customerBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: RS256 v2 External ID access token for the configured customer API and SPA; never an ID token or staff token.
