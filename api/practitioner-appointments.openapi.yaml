openapi: 3.0.3
info:
  title: Wellness Centre Practitioner Appointments
  version: 1.0.0
  description: Practitioner-scoped booking plus clinic appointment changes, including administrator reassignment.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /appointments:
    get:
      summary: List authorized appointments
      parameters:
        - { name: view, in: query, schema: { type: string, enum: [all, upcoming, past] } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: scope, in: query, schema: { type: string, enum: [practitioner] } }
      responses:
        '200': { description: Appointments visible to the authenticated role }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      summary: Confirm an appointment
      description: A practitioner may create only their own active practitioner-managed appointment. Existing booking validation, availability, pricing, room, travel, and idempotency rules apply.
      responses:
        '200': { description: Confirmed appointment }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Schedule, room, price, or replay conflict }
        '422': { description: Validation failure, including a reschedule request that keeps the existing start time }
  /appointments/{id}:
    patch:
      summary: Reschedule, cancel, or reassign an appointment
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/RescheduleRequest'
                - $ref: '#/components/schemas/CancelRequest'
                - $ref: '#/components/schemas/ReassignRequest'
      responses:
        '200': { description: Updated appointment; exact retries return the existing result }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Appointment not found }
        '409': { description: Stale version, non-editable state, or scheduling conflict }
        '422': { description: Validation failure }
  /appointments/{id}/availability:
    get:
      summary: Search replacement times for an authorized appointment
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
        - { name: date_from, in: query, required: true, schema: { type: string, format: date } }
        - { name: date_to, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200': { description: Replacement availability calculated while excluding this appointment from conflict checks and omitting its unchanged current start time }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Appointment not found }
  /appointments/{id}/reassignment-options:
    get:
      summary: List eligible practitioners for a same-time, same-price in-clinic reassignment
      description: Clinic administrator only. On-Site appointments are excluded. Qualifications are not yet part of service eligibility.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '200': { description: Array of practitioner_id and practitioner_name candidates }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Appointment not found }
        '409': { description: Appointment is no longer editable }
        '422': { description: Reassignment is unsupported for this appointment }
  /appointments/{id}/logistics-notes:
    get:
      summary: List appointment-specific logistics notes
      description: Clinic administrators and reception can view clinic appointments. Practitioners can view only appointments assigned to them. Clients and other roles are denied. Returns the newest 100 notes with author and creation time. Notes are not included in client communications or clinical treatment records.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '200': { description: Appointment logistics note history }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Appointment not found or not assigned to this practitioner }
    post:
      summary: Append an appointment logistics note
      description: Notes cannot be edited or deleted through this API. Intended for arrival, access, and equipment instructions; not treatment or health information.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note]
              properties:
                note: { type: string, minLength: 1, maxLength: 500 }
      responses:
        '201': { description: Note appended with author and creation time }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Appointment not found or not assigned to this practitioner }
        '422': { description: Invalid note }
  /booking-options:
    get:
      summary: Get active booking combinations
      parameters:
        - { name: scope, in: query, schema: { type: string, enum: [practitioner] } }
      responses:
        '200': { description: Active combinations, rooms, and an editable default_location_id. Practitioner scope prefers the signed-in practitioner's active base location; administrative scope uses the only eligible location or the first configured eligible location. }
        '403': { $ref: '#/components/responses/Forbidden' }
  /booking-clients:
    get:
      summary: Search minimal client details for booking
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2, maxLength: 190 } }
        - { name: scope, in: query, schema: { type: string, enum: [practitioner] } }
      responses:
        '200': { description: Authorized scheduling roles receive minimal booking details for matching active clinic clients; this does not grant client-directory or clinical-record access }
        '403': { $ref: '#/components/responses/Forbidden' }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  responses:
    Forbidden:
      description: Role or resource relationship does not permit the operation
  schemas:
    RescheduleRequest:
      type: object
      required: [action, version, starts_at]
      properties:
        action: { type: string, enum: [reschedule] }
        version: { type: integer, minimum: 1 }
        starts_at: { type: string, format: date-time }
        room_id: { type: integer, nullable: true }
        reason: { type: string, maxLength: 1000 }
    CancelRequest:
      type: object
      required: [action, version]
      properties:
        action: { type: string, enum: [cancel] }
        version: { type: integer, minimum: 1 }
        reason: { type: string, maxLength: 1000 }
    ReassignRequest:
      type: object
      required: [action, version, practitioner_id, reason]
      properties:
        action: { type: string, enum: [reassign] }
        version: { type: integer, minimum: 1 }
        practitioner_id: { type: integer, minimum: 1 }
        reason: { type: string, minLength: 1, maxLength: 1000 }
