<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Local session feasibility prototype</title><style>pre { white-space: pre-wrap; overflow-wrap: anywhere; } button { margin: .25rem; } :focus-visible { outline: 3px solid #164b72; outline-offset: 2px; }</style></head>
