events {}
http {
  include /etc/nginx/mime.types;
  upstream wellness_api { server api:80; }
  server {
    listen 80;
    server_name _;
    root /srv/portal;
    location = /api/runtime-config.php {
      proxy_set_header Host $http_host;
      proxy_pass http://wellness_api/runtime-config.php;
    }
    location /api/ {
      proxy_set_header Host $http_host;
      proxy_pass http://wellness_api;
    }
    location / { try_files $uri $uri/ /index.html; }
  }
  server {
    listen 81;
    server_name _;
    root /srv/wellnexa;
    location = /api/public/contact {
      proxy_set_header Host $http_host;
      proxy_pass http://wellness_api/api/v1/site-config;
    }
    location /api/public/ {
      rewrite ^/api/public/(.*)$ /api/v1/public/$1 break;
      proxy_set_header Host $http_host;
      proxy_pass http://wellness_api;
    }
    location /api/v1/ {
      proxy_set_header Host $http_host;
      proxy_pass http://wellness_api;
    }
    location / { try_files $uri $uri/ /index.html; }
  }
  server {
    listen 82;
    server_name _;
    location = /admin/ { rewrite ^ /admin/central.html last; }
    location /api/ {
      proxy_set_header Host $http_host;
      proxy_pass http://wellness_api;
    }
    location /admin/ {
      alias /srv/admin/;
      try_files $uri $uri/ /admin/central.html;
    }
    location / { return 302 /admin/; }
  }
  server {
    listen 83;
    server_name _;
    root /srv/livinlively;
    location = /api/runtime-config.php {
      proxy_set_header Host $http_host;
      proxy_pass http://wellness_api/runtime-config.php;
    }
    location /api/ {
      proxy_set_header Host $http_host;
      proxy_pass http://wellness_api;
    }
    location / { try_files $uri $uri/ /index.html; }
  }
}
